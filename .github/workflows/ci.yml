name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded pull-request pushes are safe to cancel, but a push to main must
  # always run to completion: a release is cut from a main commit, and a
  # cancelled run would leave that exact commit with no completed CI result to
  # gate the release on.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install the locked Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install the locked npm runtime
        run: npm install --global --ignore-scripts npm@11.16.0

      - name: Assert the pinned npm runtime
        run: test "$(npm --version)" = '11.16.0'

      - name: Prove the native install-script policy fails closed
        run: node scripts/validate-install-script-policy.mjs

      - name: Install from the lockfile
        run: npm ci --ignore-scripts=false --strict-allow-scripts

      # Nothing in this repository otherwise reports that an exactly pinned
      # dependency has since been found vulnerable. The shipped artifact is
      # the blocking gate: it must stay free of known high-severity
      # advisories. Build and test tooling is reported but does not fail the
      # run, because remediating it means re-pinning an exact dependency and
      # regenerating the lockfile, which is a reviewed change rather than
      # something CI should force.
      - name: Audit the shipped dependency tree
        run: npm audit --omit=dev --audit-level=high

      - name: Report advisories in build and test tooling
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Validate source and unit/integration contracts
        run: npm run validate

      - name: Build and verify the closed production artifact
        run: npm run build

      - name: Verify local byte reproducibility
        run: npm run verify:reproducible

  browser:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install the locked Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install the locked npm runtime
        run: npm install --global --ignore-scripts npm@11.16.0

      - name: Assert the pinned npm runtime
        run: test "$(npm --version)" = '11.16.0'

      - name: Prove the native install-script policy fails closed
        run: node scripts/validate-install-script-policy.mjs

      - name: Install from the lockfile
        run: npm ci --ignore-scripts=false --strict-allow-scripts

      - name: Install pinned Playwright browser binaries
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run production-serving browser checks
        run: npm run test:browser

      - name: Upload failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-artifacts
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
